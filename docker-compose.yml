version: "3.9"

services:
  # ============================================================================
  # PostgreSQL — Primary database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: caterconnect_postgres
    environment:
      POSTGRES_USER: caterconnect
      POSTGRES_PASSWORD: caterconnect
      POSTGRES_DB: caterconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caterconnect -d caterconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # Redis — Cache and rate limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: caterconnect_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caterconnect_backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://caterconnect:caterconnect@postgres:5432/caterconnect
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      OTP_DEV_MODE: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================================
  # Customer Frontend
  # ============================================================================
  customer:
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
    container_name: caterconnect_customer
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/customer:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  # ============================================================================
  # Admin Frontend
  # ============================================================================
  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: caterconnect_admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/admin:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev -- -p 3001

volumes:
  postgres_data:
  redis_data:
