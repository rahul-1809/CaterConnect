version: "3.9"

# =============================================================================
# CaterConnect — Local Development
#
# Database: Supabase (external cloud — configure DATABASE_URL in backend/.env)
# Cache:    Redis (local container)
# Backend:  FastAPI
# Frontend: Next.js (customer + admin)
#
# Start everything:
#   docker compose up
#
# Start only backend services (no frontend):
#   docker compose up redis backend
#
# Run without Docker (preferred for fast dev):
#   cd backend && uvicorn app.main:app --reload
#   cd frontend/customer && npm run dev
#   cd frontend/admin && npm run dev -- -p 3001
# =============================================================================

services:
  # ============================================================================
  # Redis — Cache and rate limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: caterconnect_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caterconnect_backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================================
  # Customer Frontend (Next.js — port 3000)
  # ============================================================================
  customer:
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
    container_name: caterconnect_customer
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/customer/src:/app/src
      - ./frontend/customer/public:/app/public
    depends_on:
      - backend

  # ============================================================================
  # Admin Frontend (Next.js — port 3001)
  # ============================================================================
  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: caterconnect_admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/admin/src:/app/src
      - ./frontend/admin/public:/app/public
    depends_on:
      - backend

volumes:
  redis_data:
